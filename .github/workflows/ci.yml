name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Lint skills (self-test, then repo)
        shell: bash
        run: |
          bash scripts/lint-skills.sh --self-test
          bash scripts/lint-skills.sh

      - name: Hook and script self-tests
        shell: bash
        run: |
          node hooks/skill-router.js --self-test
          for s in hooks/foreman-nudge.sh hooks/git-guard.sh \
                   skills/ba-flow-logic/ba-verify.sh \
                   skills/ui-design-logic/design-verify.sh \
                   skills/security-logic/security-verify.sh \
                   skills/ui-ux-triage/triage-verify.sh; do
            echo "== $s"
            bash "$s" --self-test
          done
          echo "== scripts/selftest-giveup-guard.sh"
          bash scripts/selftest-giveup-guard.sh

      - name: Install/uninstall round trip (bash)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          H="$RUNNER_TEMP/h"; FAKE="$RUNNER_TEMP/home"
          mkdir -p "$H" "$FAKE"
          export HOME="$FAKE"
          bash install.sh --claude-home "$H"
          bash install.sh --claude-home "$H"
          bash uninstall.sh --claude-home "$H" --remove-block
          left="$(find "$H" "$FAKE" -type f ! -name '*bak*' ! -name '*backup*' ! -path '*backup*' ! -name CLAUDE.md ! -name AGENTS.md || true)"
          if [ -n "$left" ]; then echo "Files left after uninstall:"; echo "$left"; exit 1; fi
          if grep -rq 'atelier:begin' "$H" "$FAKE" --include=CLAUDE.md --include=AGENTS.md --exclude-dir='*backup*'; then echo "atelier block still present"; exit 1; fi
          echo "round trip OK"

      - name: Install/uninstall round trip (PowerShell)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          H="$RUNNER_TEMP/h"; FAKE="$RUNNER_TEMP/home"
          mkdir -p "$H" "$FAKE"
          export HOME="$FAKE" USERPROFILE="$FAKE"
          powershell -NoProfile -File install.ps1 -ClaudeHome "$H"
          powershell -NoProfile -File install.ps1 -ClaudeHome "$H"
          powershell -NoProfile -File uninstall.ps1 -ClaudeHome "$H" -RemoveBlock
          left="$(find "$H" "$FAKE" -type f ! -name '*bak*' ! -name '*backup*' ! -path '*backup*' ! -name CLAUDE.md ! -name AGENTS.md || true)"
          if [ -n "$left" ]; then echo "Files left after uninstall:"; echo "$left"; exit 1; fi
          if grep -rq 'atelier:begin' "$H" "$FAKE" --include=CLAUDE.md --include=AGENTS.md --exclude-dir='*backup*'; then echo "atelier block still present"; exit 1; fi
          echo "round trip OK"
